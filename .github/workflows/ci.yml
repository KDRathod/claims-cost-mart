name: CI

# Runs on every push and pull request. Uses DuckDB only, so it is free, needs
# no secrets, and works on forks.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DBT_TARGET: duckdb
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DUCKDB_PATH: ${{ github.workspace }}/data/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (generator and loader)
        run: pytest -q

      - name: Generate the landing zone
        run: python generator/simulate_adjudication.py

      - name: Load raw tables
        run: python ingestion/load_raw.py --target duckdb

      - name: dbt build (models, snapshot, data tests, unit tests)
        working-directory: dbt
        run: |
          dbt deps
          dbt build

      - name: Replay 5 daily loads and compare incremental vs full rebuild
        run: python scripts/replay.py --daily-days 5
