name: CI

# Runs on every push and pull request. Uses DuckDB only, so it is free, needs
# no secrets, and works on forks.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DBT_TARGET: duckdb
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DUCKDB_PATH: ${{ github.workspace }}/data/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests (generator and loader)
        run: pytest -q

      - name: Generate the landing zone
        run: python generator/simulate_adjudication.py

      - name: Load raw tables
        run: python ingestion/load_raw.py --target duckdb

      - name: dbt build (models, snapshot, data tests, unit tests)
        working-directory: dbt
        run: |
          dbt deps
          dbt build

      - name: Replay 5 daily loads and compare incremental vs full rebuild
        run: python scripts/replay.py --daily-days 5

  airflow-dag:
    # Runs the real DAG end to end on DuckDB, so a broken task order, a bad
    # template or an import error is caught on the pull request.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DBT_TARGET: duckdb
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
      DUCKDB_PATH: ${{ github.workspace }}/data/warehouse.duckdb
      AIRFLOW__CORE__DAGS_FOLDER: ${{ github.workspace }}/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline dependencies
        run: |
          pip install -r requirements.txt
          echo "PIPELINE_PYTHON=$(which python)" >> "$GITHUB_ENV"
          echo "PIPELINE_DBT=$(which dbt)" >> "$GITHUB_ENV"

      - name: Install Airflow (separate virtualenv)
        run: |
          python -m venv "$RUNNER_TEMP/airflow-venv"
          "$RUNNER_TEMP/airflow-venv/bin/pip" install -q "apache-airflow==3.4.0" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.4.0/constraints-3.12.txt"
          echo "AIRFLOW_HOME=$RUNNER_TEMP/airflow-home" >> "$GITHUB_ENV"

      - name: Run claims_daily for one date
        run: |
          "$RUNNER_TEMP/airflow-venv/bin/airflow" db migrate > /dev/null 2>&1
          "$RUNNER_TEMP/airflow-venv/bin/airflow" dags test claims_daily 2026-10-31
