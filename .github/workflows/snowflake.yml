name: Snowflake pipeline

# Production path. Loads the feed into Snowflake and runs dbt there.
#   daily     load whatever is new, then dbt build (scheduled)
#   backfill  replay history at a few checkpoints so the provider snapshot
#             captures each version, then catch up to today (run once)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily or backfill"
        type: choice
        options: [daily, backfill]
        default: daily
  schedule:
    - cron: "17 11 * * *"   # 05:17 US Central, off the top of the hour on purpose

concurrency:
  group: snowflake-pipeline   # never two loads at once
  cancel-in-progress: false

permissions:
  contents: read
  issues: write   # a failed run opens an issue (the alert)

env:
  DBT_TARGET: snowflake
  DBT_PROFILES_DIR: ${{ github.workspace }}/dbt
  SNOWFLAKE_ACCOUNT: ${{ vars.SNOWFLAKE_ACCOUNT }}
  SNOWFLAKE_USER: CLAIMS_SVC
  SNOWFLAKE_ROLE: CLAIMS_TRANSFORMER
  SNOWFLAKE_WAREHOUSE: CLAIMS_WH
  SNOWFLAKE_DATABASE: CLAIMS
  APPLY_GOVERNANCE: "true"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pipeline dependencies
        run: |
          pip install -r requirements.txt
          echo "PIPELINE_PYTHON=$(which python)" >> "$GITHUB_ENV"
          echo "PIPELINE_DBT=$(which dbt)" >> "$GITHUB_ENV"

      # Airflow gets its own virtualenv: its pinned dependencies conflict
      # with dbt's, which is also how most production setups are laid out.
      - name: Install Airflow (separate virtualenv)
        run: |
          python -m venv "$RUNNER_TEMP/airflow-venv"
          "$RUNNER_TEMP/airflow-venv/bin/pip" install -q "apache-airflow==3.4.0" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-3.4.0/constraints-3.12.txt"
          echo "AIRFLOW_HOME=$RUNNER_TEMP/airflow-home" >> "$GITHUB_ENV"
          echo "AIRFLOW__CORE__DAGS_FOLDER=$GITHUB_WORKSPACE/airflow/dags" >> "$GITHUB_ENV"
          echo "AIRFLOW__CORE__LOAD_EXAMPLES=false" >> "$GITHUB_ENV"

      - name: Write the service key to a temp file
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > "$RUNNER_TEMP/claims_svc.p8"
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$RUNNER_TEMP/claims_svc.p8" >> "$GITHUB_ENV"

      - name: Check the Snowflake login
        run: python scripts/snowflake_check.py

      - name: Backfill history at snapshot checkpoints
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'backfill'
        run: |
          FEED_AS_OF_DATE=$(date -u +%F) python generator/simulate_adjudication.py
          (cd dbt && dbt deps)
          for d in 2023-01-31 2024-07-31 2026-01-31; do
            echo "::group::load and build through $d"
            python ingestion/load_raw.py --target snowflake --through-date "$d"
            (cd dbt && dbt build)
            echo "::endgroup::"
          done

      - name: Run the claims_daily DAG for today
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          "$RUNNER_TEMP/airflow-venv/bin/airflow" db migrate > /dev/null 2>&1
          "$RUNNER_TEMP/airflow-venv/bin/airflow" dags test claims_daily "$(date -u +%F)"

      # Belt and braces: if the run died before Airflow's own failure
      # callback could fire (for example the install step), still alert.
      - name: Alert on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/alert.py --task workflow --run-date "$(date -u +%F)" --message "Workflow failed outside a DAG task. See the run log."

      - name: Remove the key file
        if: always()
        run: rm -f "$RUNNER_TEMP/claims_svc.p8"
