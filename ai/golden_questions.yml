- id: q14
  kind: answer
  category: ratio
  question: What percentage of claims with a service date in 2025 were adjusted after payment?
  sql: >
    select round(100 * count_if(was_adjusted) / count(*), 2) from {m}.fct_claims
    where service_date between '2025-01-01' and '2025-12-31'

- id: q15
  kind: answer
  category: simple_aggregate
  question: How many claims with a service date in 2025 had a payment reversed?
  sql: select count(*) from {m}.fct_claims where service_date between '2025-01-01' and '2025-12-31' and was_reversed

- id: q16
  kind: answer
  category: group_by
  question: What was the average paid amount per paid claim by claim type for services in 2025?
  sql: >
    select claim_type, round(avg(paid_amount), 2) from {m}.fct_claims
    where service_date between '2025-01-01' and '2025-12-31' and claim_status = 'paid' group by 1

- id: q17
  kind: answer
  category: simple_aggregate
  question: How many claims with a service date in 2025 were denied and then overturned on appeal?
  sql: >
    select count(*) from {m}.fct_claims
    where service_date between '2025-01-01' and '2025-12-31' and was_overturned_on_appeal

- id: q18
  kind: answer
  category: group_by_join
  question: What was the total paid amount for facility stay claims by payer for services in 2025?
  sql: >
