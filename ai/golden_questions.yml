# Golden questions for the natural-language layer.
#
# Each question has hand-written SQL that defines the right answer. The eval
# runs the model's SQL and this SQL and compares the RESULTS (not the text),
# because two different queries can both be correct.
#
# kind: answer   the model should return SQL whose result matches
# kind: refuse   the right behaviour is to NOT return SQL (data does not
#                exist, or the question asks for a forecast or for PII)
#
# {m} expands to the marts schema.

- id: q01
  kind: answer
  category: simple_aggregate
  question: How many claims had a service date in 2025?
  sql: select count(*) from {m}.fct_claims where service_date between '2025-01-01' and '2025-12-31'

- id: q02
  kind: answer
  category: simple_aggregate
  question: What was the total paid amount for claims with a service date in March 2026?
  sql: select round(sum(paid_amount), 2) from {m}.fct_claims where service_month = '2026-03-01'

- id: q03
  kind: answer
  category: group_by_join
  question: What was the total paid amount by payer type for services in 2025?
  sql: >
    select p.payer_type, round(sum(c.paid_amount), 2)
    from {m}.fct_claims c join {m}.dim_payer p on c.payer_id = p.payer_id
    where c.service_date between '2025-01-01' and '2025-12-31' group by 1

- id: q04
  kind: answer
  category: top_n
  question: Which payer had the highest total paid amount for services in 2025, and how much was it?
  sql: >
    select p.payer_name, round(sum(c.paid_amount), 2)
    from {m}.fct_claims c join {m}.dim_payer p on c.payer_id = p.payer_id
    where c.service_date between '2025-01-01' and '2025-12-31'
    group by 1 order by 2 desc limit 1

- id: q05
  kind: answer
  category: ratio
  question: What was the denial rate as a percentage for each payer for services in 2025?
  sql: >
    select p.payer_name, round(100 * count_if(c.claim_status = 'denied') / count(*), 2)
    from {m}.fct_claims c join {m}.dim_payer p on c.payer_id = p.payer_id
    where c.service_date between '2025-01-01' and '2025-12-31' group by 1

- id: q06
  kind: answer
  category: top_n
  question: For claims with a service date in 2025 whose current status is denied, what are the top 3 denial reason codes by number of claims?
  sql: >
    select denial_reason_code, count(*) from {m}.fct_claims
    where service_date between '2025-01-01' and '2025-12-31' and claim_status = 'denied'
    group by 1 order by 2 desc limit 3

- id: q07
  kind: answer
  category: simple_aggregate
  question: How many claims are currently pending?
  sql: select count(*) from {m}.fct_claims where claim_status = 'pending'

- id: q08
  kind: answer
  category: group_by
  question: What was the average number of days from submission to decision by service category for services in 2025?
  sql: >
    select service_category, round(avg(days_submission_to_decision), 2) from {m}.fct_claims
    where service_date between '2025-01-01' and '2025-12-31' group by 1

- id: q09
  kind: answer
  category: group_by
  question: Show total billed, total allowed and total paid amounts by service category for services in 2025.
  sql: >
    select service_category, round(sum(billed_amount), 2), round(sum(allowed_amount), 2), round(sum(paid_amount), 2)
    from {m}.fct_claims where service_date between '2025-01-01' and '2025-12-31' group by 1

- id: q10
  kind: answer
  category: group_by
  question: What was the total paid amount by provider network status for services in 2025?
  sql: >
    select provider_network_status_at_service, round(sum(paid_amount), 2) from {m}.fct_claims
    where service_date between '2025-01-01' and '2025-12-31' group by 1

- id: q11
  kind: answer
  category: time_series
  question: How many claims were there in each service month of 2026?
  sql: >
    select service_month, count(*) from {m}.fct_claims
    where service_month between '2026-01-01' and '2026-12-01' group by 1

- id: q12
  kind: answer
  category: distinct_count
  question: How many distinct members had at least one claim with a service date in 2025?
  sql: select count(distinct member_id) from {m}.fct_claims where service_date between '2025-01-01' and '2025-12-31'

- id: q13
  kind: answer
  category: group_by_join
  question: What was the total paid amount by member age band for services in 2025?
  sql: >
    select m.age_band, round(sum(c.paid_amount), 2)
    from {m}.fct_claims c join {m}.dim_member m on c.member_id = m.member_id
