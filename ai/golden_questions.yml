    from {m}.fct_claims c join {m}.dim_payer p on c.payer_id = p.payer_id
    where c.service_date between '2025-01-01' and '2025-12-31' and c.service_category = 'facility_stay' group by 1

- id: q19
  kind: answer
  category: top_n
  question: Which county had the highest total paid amount for services in 2025?
  sql: >
