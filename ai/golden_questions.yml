- id: q23
  kind: answer
  category: pmpm
  question: What is the total IBNR estimate across service months that are not yet mature?
  sql: select round(sum(ibnr_estimate), 2) from {m}.mart_pmpm_monthly where not is_mature

- id: q24
  kind: answer
