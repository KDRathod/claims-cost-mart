    where c.service_date between '2025-01-01' and '2025-12-31' group by 1 order by 2 desc limit 1

- id: q20
  kind: answer
  category: group_by_join
  question: Compare total paid amount for government versus private payers for services in the first quarter of 2026.
  sql: >
    select p.payer_type, round(sum(c.paid_amount), 2)
