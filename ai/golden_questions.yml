- id: q21
  kind: answer
  category: pmpm
  question: What was the PMPM paid to date for each payer in June 2025?
  sql: >
    select payer_name, round(sum(paid_to_date) / sum(member_months), 2) from {m}.mart_pmpm_monthly
    where service_month = '2025-06-01' group by 1

- id: q22
  kind: answer
  category: pmpm
  question: What was the overall PMPM paid to date for each service month in 2025?
  sql: >
